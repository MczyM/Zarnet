<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect — Zarnet</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B1120;--surface:#131B2E;--lime:#B6FF3C;--blue:#4F8CFF;--text:#F5F7FA;--muted:#8A93A6;--line:#26314D;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px;max-width:400px;width:100%;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:1.2rem;margin-bottom:24px;}
  .bars{display:inline-flex;align-items:flex-end;gap:3px;height:16px;}
  .bars i{display:block;width:3px;background:var(--lime);border-radius:1px;}
  .bars i:nth-child(1){height:5px;}.bars i:nth-child(2){height:9px;}.bars i:nth-child(3){height:13px;}.bars i:nth-child(4){height:16px;background:var(--blue);}
  h1{font-family:'Space Grotesk';font-size:1.3rem;margin-bottom:8px;}
  p.sub{color:var(--muted);font-size:.88rem;margin-bottom:24px;}
  input{
    width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    color:var(--text);font-family:'IBM Plex Mono';font-size:1.1rem;text-align:center;letter-spacing:.05em;
    margin-bottom:16px;text-transform:uppercase;
  }
  input:focus{outline:2px solid var(--lime);outline-offset:2px;}
  button{
    width:100%;padding:14px;border-radius:10px;background:var(--lime);color:#0B1120;
    font-weight:600;border:none;font-size:.95rem;cursor:pointer;
  }
  button:disabled{opacity:.5;cursor:default;}
  .status{margin-top:16px;font-size:.85rem;text-align:center;color:var(--muted);}
  .status.ok{color:var(--lime);}
  .status.err{color:#FF6B6B;}
  a.link{display:block;text-align:center;color:var(--blue);font-size:.85rem;margin-top:20px;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="bars"><i></i><i></i><i></i><i></i></span> <span id="brandName">Zarnet</span></div>
    <h1>Enter your voucher code</h1>
    <p class="sub">Just bought one? It's the code shown on your payment confirmation.</p>

    <input id="codeInput" placeholder="ZN-XXXX-XXXX" maxlength="12">
    <button id="redeemBtn">Connect</button>
    <div id="status" class="status"></div>

    <a class="link" id="pricingLink" href="#">Don't have a voucher? See pricing →</a>
  </div>

<script>
const API = window.ZARNET_API_BASE;
const params = new URLSearchParams(location.search);
const SITE = params.get('site') || 'demo';
document.getElementById('pricingLink').href = `index.html?site=${encodeURIComponent(SITE)}`;

// Omada redirects a connecting device to this page with query params
// identifying the device/AP/SSID. Param names vary slightly by controller
// firmware version, so we check the common aliases from both the legacy
// and current External Portal Server docs.
function readOmadaParams() {
  return {
    clientMac: params.get('clientMac') || params.get('cid') || '',
    apMac: params.get('apMac') || params.get('ap') || '',
    ssidName: params.get('ssidName') || params.get('ssid') || '',
    radioId: params.get('radioId') || params.get('rid') || '',
  };
}

// Pre-fill code if arriving from the purchase page
const prefillCode = params.get('code');
if (prefillCode) document.getElementById('codeInput').value = prefillCode;

// Best-effort branding fetch — non-blocking, page still works if it fails.
fetch(`${API}/sites/${encodeURIComponent(SITE)}/public`)
  .then((r) => (r.ok ? r.json() : null))
  .then((data) => {
    if (data && data.site) {
      document.getElementById('brandName').textContent = data.site.brand_logo_text || data.site.name;
      if (data.site.brand_accent_color) {
        document.documentElement.style.setProperty('--lime', data.site.brand_accent_color);
      }
    }
  })
  .catch(() => {});

document.getElementById('redeemBtn').addEventListener('click', async () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('redeemBtn');

  if (!code) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Enter your voucher code first.';
    return;
  }

  const omadaParams = readOmadaParams();
  if (!omadaParams.clientMac) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Could not detect your device. Make sure you joined the WiFi network first.';
    return;
  }

  btn.disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = 'Connecting…';

  try {
    const res = await fetch(`${API}/sites/${encodeURIComponent(SITE)}/vouchers/${code}/redeem`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(omadaParams),
    });
    const data = await res.json();

    if (res.ok && data.authorized) {
      statusEl.className = 'status ok';
      statusEl.textContent = "✓ You're connected. Enjoy the internet.";
    } else {
      statusEl.className = 'status err';
      statusEl.textContent = data.error || 'Could not redeem that voucher.';
      btn.disabled = false;
    }
  } catch (err) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Could not reach the Zarnet server.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
