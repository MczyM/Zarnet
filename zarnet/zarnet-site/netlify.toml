# Proxies /api/* on demo.zarnet.online through to the real backend, so the
# investor-facing site is a single origin with no CORS to deal with.
#
# BEFORE YOUR FIRST DEPLOY: replace REPLACE-WITH-YOUR-BACKEND-URL below with
# your actual Railway (or Render) backend URL once it's deployed — see
# DEPLOY.md in this same folder for the exact steps and order to do this in.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND-URL/:splat"
  status = 200
  force = true
