<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy a voucher — Zarnet</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B1120;--surface:#131B2E;--lime:#B6FF3C;--blue:#4F8CFF;--text:#F5F7FA;--muted:#8A93A6;--line:#26314D;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px;max-width:420px;width:100%;}
  h1{font-family:'Space Grotesk';font-size:1.4rem;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:28px;}
  .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem;}
  .row b{font-family:'IBM Plex Mono';}
  .code{
    font-family:'IBM Plex Mono';font-size:1.5rem;letter-spacing:.05em;text-align:center;
    background:rgba(182,255,60,0.1);color:var(--lime);border:1px dashed var(--lime);
    border-radius:10px;padding:16px;margin:20px 0;
  }
  a.btn, button.btn{
    display:block;text-align:center;width:100%;padding:14px;border-radius:10px;
    background:var(--lime);color:#0B1120;font-weight:600;border:none;font-size:.95rem;
    margin-top:16px;cursor:pointer;text-decoration:none;
  }
  .status{font-size:.85rem;color:var(--muted);margin-top:14px;text-align:center;}
  .status.paid{color:var(--lime);}
  .status.err{color:#FF6B6B;}
  a.back{display:block;text-align:center;color:var(--muted);font-size:.85rem;margin-top:20px;}
  .spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="card">
    <h1 id="pkgName">Loading package…</h1>
    <p class="sub">Pay with any Solana wallet. Your voucher activates the moment payment is confirmed.</p>

    <div id="details"></div>

    <div id="payArea"></div>
    <div id="statusArea" class="status"></div>

    <a href="#" id="backLink" class="back">← Back to pricing</a>
  </div>

<script>
const API = window.ZARNET_API_BASE;
const params = new URLSearchParams(location.search);
const SITE = params.get('site') || 'demo';
const packageSlug = params.get('package');
document.getElementById('backLink').href = `index.html?site=${encodeURIComponent(SITE)}`;

let currentCode = null;
let pollTimer = null;

async function start() {
  if (!packageSlug) {
    document.getElementById('pkgName').textContent = 'No package selected';
    return;
  }
  try {
    const res = await fetch(`${API}/sites/${encodeURIComponent(SITE)}/vouchers/purchase-intent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ packageSlug }),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.error || 'purchase-intent failed');
    }
    const data = await res.json();
    currentCode = data.code;

    document.getElementById('pkgName').textContent = data.package;
    document.getElementById('details').innerHTML = `
      <div class="row"><span>Voucher code</span><b>${data.code}</b></div>
      <div class="row"><span>Amount</span><b>${(data.expectedLamports / 1e9).toFixed(6)} SOL</b></div>
    `;
    document.getElementById('payArea').innerHTML = `
      <a class="btn" href="${data.paymentUrl}">Open in wallet app</a>
    `;
    document.getElementById('statusArea').innerHTML = `<span class="spinner"></span>Waiting for payment…`;

    pollTimer = setInterval(checkPayment, 4000);
  } catch (err) {
    document.getElementById('pkgName').textContent = 'Something went wrong';
    document.getElementById('statusArea').className = 'status err';
    document.getElementById('statusArea').textContent = err.message || 'Could not reach the Zarnet server.';
  }
}

async function checkPayment() {
  if (!currentCode) return;
  try {
    const res = await fetch(`${API}/sites/${encodeURIComponent(SITE)}/vouchers/${currentCode}/check-payment`, { method: 'POST' });
    const data = await res.json();
    if (data.paid) {
      clearInterval(pollTimer);
      const statusEl = document.getElementById('statusArea');
      statusEl.className = 'status paid';
      statusEl.textContent = "✓ Payment confirmed — you're ready to connect.";
      document.getElementById('payArea').innerHTML = `
        <a class="btn" href="connect.html?site=${encodeURIComponent(SITE)}&code=${currentCode}">Connect now</a>
      `;
    }
  } catch (err) {
    // silent — will retry on next interval
  }
}

start();
</script>
</body>
</html>
